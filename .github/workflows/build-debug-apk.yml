name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # KernelSU's ghostlock-lkm.yml / build-manager.yml publish the rolling ksud
  # and manager release assets and dispatch these events when the optional
  # RMP_DISPATCH_TOKEN is set; workflow_dispatch allows a manual rebuild.
  repository_dispatch:
    types: [ghostlock-ksud-published, ghostlock-manager-published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch the latest GhostLock ksud from the KernelSU fork
        env:
          KSU_RELEASE_BASE: https://github.com/doccstat/KernelSU/releases/download/ghostlock-latest
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # Verify the published checksum and that it is an aarch64 Android ELF
          # before replacing the committed asset. Fall back to the committed
          # ksud when the release is missing or unverifiable.
          if curl -fsSL -o "$tmp/ksud" "$KSU_RELEASE_BASE/ksud" &&
             curl -fsSL -o "$tmp/ksud.sha256" "$KSU_RELEASE_BASE/ksud.sha256" &&
             (cd "$tmp" && sha256sum -c --quiet ksud.sha256) &&
             file "$tmp/ksud" | grep -q 'ARM aarch64'; then
            install -m 0755 "$tmp/ksud" app/src/main/assets/ksud/ksud
            echo "Using ksud from the KernelSU fork release:"
            sha256sum app/src/main/assets/ksud/ksud
          else
            echo "::warning::Could not fetch a verified ksud release asset; keeping the committed asset."
          fi
          rm -rf "$tmp"

      - name: Fetch the latest GhostLock manager from the KernelSU fork
        env:
          KSU_RELEASE_BASE: https://github.com/doccstat/KernelSU/releases/download/ghostlock-latest
          MANAGER_PACKAGE: com.lixingchi.kernelsu
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # The manager must be the signed build the fork's driver pins
          # (com.lixingchi.kernelsu + our signer). Verify checksum, that the
          # published metadata names that package, and that it is an APK
          # before replacing the committed asset; otherwise keep the committed
          # copy so the build never ships a mismatched manager.
          if curl -fsSL -o "$tmp/GhostLock-manager.apk" "$KSU_RELEASE_BASE/GhostLock-manager.apk" &&
             curl -fsSL -o "$tmp/GhostLock-manager.apk.sha256" "$KSU_RELEASE_BASE/GhostLock-manager.apk.sha256" &&
             curl -fsSL -o "$tmp/manager.json" "$KSU_RELEASE_BASE/manager.json" &&
             (cd "$tmp" && sha256sum -c --quiet GhostLock-manager.apk.sha256) &&
             python3 -c "import json,sys; d=json.load(open('$tmp/manager.json')); sys.exit(0 if d.get('package')=='$MANAGER_PACKAGE' else 1)" &&
             file "$tmp/GhostLock-manager.apk" | grep -qiE 'android package|zip archive'; then
            install -m 0644 "$tmp/GhostLock-manager.apk" app/src/main/assets/manager/GhostLock-manager.apk
            echo "Using manager from the KernelSU fork release:"
            sha256sum app/src/main/assets/manager/GhostLock-manager.apk
            cat "$tmp/manager.json"
          else
            echo "::warning::Could not fetch a verified manager release asset; keeping the committed manager."
          fi
          rm -rf "$tmp"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v4 defaults `packages` to `platform-tools`; add the build's SDK.
          # compileSdk 37 means the AGP 9 "minor API level" package
          # `platforms;android-37.0` - plain `platforms;android-37` does not
          # exist, and `api-level`/`cache` are not inputs of this action. (The
          # old v3 failure was its default `tools platform-tools`: `tools` no
          # longer exists in the SDK repo and `sdkmanager tools` exited 1.)
          packages: 'platform-tools platforms;android-37.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install NDK required by AGP 9.3.1
        # AGP 9.3.1 uses NDK 28.2.13676358 as default android.ndkVersion.
        # GitHub runners pre-install a different NDK and export ANDROID_NDK_HOME to it,
        # so install the exact version AGP wants and point ANDROID_NDK_HOME at it.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare the stable signing key
        # A debug APK signed with the runner's throwaway debug keystore can never
        # be installed as an update (INSTALL_FAILED_UPDATE_INCOMPATIBLE), so the
        # same production key that signs the manager signs this APK too. Fork PRs
        # cannot see the secret and keep AGP's default debug key.
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::No KEYSTORE secret; the PR build keeps AGP's throwaway debug key."
              exit 0
            fi
            echo "::error::No KEYSTORE secret. This build would be signed with a throwaway key and could not be installed over a previous APK. Add KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD (the values the KernelSU fork already uses)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > key.jks
          {
            echo "KEYSTORE_FILE=$PWD/key.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signing the debug APK with the stable key (alias $KEY_ALIAS)."

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          echo "APK size: $(stat -c%s "$APK") bytes"
          ls -la "$APK"
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            # Resolve exactly one apksigner: the runner has more than one
            # build-tools version, so a bare glob expands to several words and
            # apksigner reads the second path as its subcommand.
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
            if [ -n "$APKSIGNER" ]; then
              echo "apksigner: $APKSIGNER"
              "$APKSIGNER" verify --print-certs "$APK"
            else
              echo "::warning::apksigner not found under $SDK/build-tools; skipping the signer printout."
            fi
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
