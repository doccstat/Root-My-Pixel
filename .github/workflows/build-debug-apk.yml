name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # KernelSU's ghostlock-lkm.yml / build-manager.yml publish the rolling ksud
  # and manager release assets and dispatch these events when the optional
  # RMP_DISPATCH_TOKEN is set; workflow_dispatch allows a manual rebuild.
  repository_dispatch:
    types: [ghostlock-ksud-published, ghostlock-manager-published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch the latest GhostLock ksud from the KernelSU fork
        env:
          KSU_RELEASE_BASE: https://github.com/doccstat/KernelSU/releases/download/ghostlock-latest
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # Verify the published checksum and that it is an aarch64 Android ELF
          # before replacing the committed asset. Fall back to the committed
          # ksud when the release is missing or unverifiable.
          if curl -fsSL -o "$tmp/ksud" "$KSU_RELEASE_BASE/ksud" &&
             curl -fsSL -o "$tmp/ksud.sha256" "$KSU_RELEASE_BASE/ksud.sha256" &&
             (cd "$tmp" && sha256sum -c --quiet ksud.sha256) &&
             file "$tmp/ksud" | grep -q 'ARM aarch64'; then
            install -m 0755 "$tmp/ksud" app/src/main/assets/ksud/ksud
            echo "Using ksud from the KernelSU fork release:"
            sha256sum app/src/main/assets/ksud/ksud
          else
            echo "::warning::Could not fetch a verified ksud release asset; keeping the committed asset."
          fi
          rm -rf "$tmp"

      - name: Fetch the latest GhostLock manager from the KernelSU fork
        env:
          KSU_RELEASE_BASE: https://github.com/doccstat/KernelSU/releases/download/ghostlock-latest
          MANAGER_PACKAGE: com.lixingchi.kernelsu
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # The manager must be the signed build the fork's driver pins
          # (com.lixingchi.kernelsu + our signer). Verify checksum, that the
          # published metadata names that package, and that it is an APK
          # before replacing the committed asset; otherwise keep the committed
          # copy so the build never ships a mismatched manager.
          if curl -fsSL -o "$tmp/GhostLock-manager.apk" "$KSU_RELEASE_BASE/GhostLock-manager.apk" &&
             curl -fsSL -o "$tmp/GhostLock-manager.apk.sha256" "$KSU_RELEASE_BASE/GhostLock-manager.apk.sha256" &&
             curl -fsSL -o "$tmp/manager.json" "$KSU_RELEASE_BASE/manager.json" &&
             (cd "$tmp" && sha256sum -c --quiet GhostLock-manager.apk.sha256) &&
             python3 -c "import json,sys; d=json.load(open('$tmp/manager.json')); sys.exit(0 if d.get('package')=='$MANAGER_PACKAGE' else 1)" &&
             file "$tmp/GhostLock-manager.apk" | grep -qiE 'android package|zip archive'; then
            install -m 0644 "$tmp/GhostLock-manager.apk" app/src/main/assets/manager/GhostLock-manager.apk
            echo "Using manager from the KernelSU fork release:"
            sha256sum app/src/main/assets/manager/GhostLock-manager.apk
            cat "$tmp/manager.json"
          else
            echo "::warning::Could not fetch a verified manager release asset; keeping the committed manager."
          fi
          rm -rf "$tmp"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # compileSdk 37 requires platform android-37
          api-level: 37
          cache: true

      - name: Install NDK required by AGP 9.3.1
        # AGP 9.3.1 uses NDK 28.2.13676358 as default android.ndkVersion.
        # GitHub runners pre-install a different NDK and export ANDROID_NDK_HOME to it,
        # so install the exact version AGP wants and point ANDROID_NDK_HOME at it.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          echo "APK size: $(stat -c%s "$APK") bytes"
          ls -la "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
